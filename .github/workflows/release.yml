name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "~1.21"
          check-latest: true

      - name: Install clang + llvm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libelf-dev protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate protobuf
        run: make proto

      - name: Build release binaries (Rust)
        run: cargo build --workspace --release

      - name: Build release binaries (Go)
        run: |
          cd aegis-gateway && go build -o bin/gateway ./cmd/gateway/
          cd ../aegis-control-plane && go build -o bin/controller ./cmd/controller/

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/aegis-sidecar dist/
          cp target/release/aegis-policy-engine dist/
          cp target/release/aegis-audit-log dist/
          cp target/release/aegis dist/
          cp aegis-gateway/bin/gateway dist/
          cp aegis-control-plane/bin/controller dist/
          cp -r deploy dist/deploy
          cp -r paper dist/paper
          cp Makefile README.md dist/
          tar czf aegis-${{ github.ref_name }}-linux-amd64.tar.gz -C dist .

      - name: Generate checksums
        run: |
          sha256sum aegis-${{ github.ref_name }}-linux-amd64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: AEGIS ${{ github.ref_name }}
          body_path: RELEASE_CHECKLIST.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          files: |
            aegis-${{ github.ref_name }}-linux-amd64.tar.gz
            checksums.txt

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/aegis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push sidecar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/sidecar.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/gateway.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-gateway
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-control-plane
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/aegis-sidecar
          subject-digest: ${{ steps.meta.outputs.digest }}
          push-to-registry: true
