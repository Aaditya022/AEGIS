global:
  scrape_interval: 5s

scrape_configs:
  - job_name: aegis-sidecar
    static_configs:
      - targets: ["host.docker.internal:9090"]

  - job_name: aegis-gateway
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: aegis-control-plane
    static_configs:
      - targets: ["host.docker.internal:8500"]
