apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-control-plane
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: {{ include "aegis.fullname" . }}-control-plane
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          env:
            - name: AEGIS_CONTROL_PLANE_PORT
              value: "8500"
            - name: AEGIS_ETCD_ENDPOINTS
              value: {{ join "," .Values.controlPlane.etcd.endpoints | quote }}
            - name: AEGIS_POSTGRES_DSN
              value: {{ .Values.controlPlane.postgres.dsn | quote }}
            - name: AEGIS_KAFKA_BROKERS
              value: {{ .Values.controlPlane.kafka.brokers | quote }}
            - name: AEGIS_REDIS_ADDR
              value: {{ .Values.controlPlane.redis.addr | quote }}
            - name: AEGIS_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.endpoint | quote }}
            - name: RUST_LOG
              value: {{ .Values.sidecar.config.logLevel | upper }}
          ports:
            - containerPort: 8500
              name: http
            - containerPort: 8501
              name: grpc
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-control-plane
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.controlPlane.service.grpcPort }}
      targetPort: grpc
      name: grpc
  selector:
    app.kubernetes.io/component: control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegis.fullname" . }}-control-plane
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
