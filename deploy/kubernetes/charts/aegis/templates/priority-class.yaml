{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: aegis-control-plane
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
value: 1000
globalDefault: false
description: "Priority class for AEGIS control plane components"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: aegis-sidecar
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
value: 500
globalDefault: false
description: "Priority class for AEGIS sidecar proxies"
{{- end }}
