apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentpolicies.aegis.ai
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  group: aegis.ai
  names:
    kind: AgentPolicy
    plural: agentpolicies
    singular: agentpolicy
    shortNames:
      - apol
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                agentSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchFrameworks:
                      type: array
                      items:
                        type: string
                policies:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        type: string
                        enum: [recursion, budget, allowed_models, allowed_tools, allowed_urls, time_restrictions, human_approval]
                      severity:
                        type: string
                        enum: [block, warn, log]
                      condition:
                        type: string
                      enabled:
                        type: boolean
                complianceFramework:
                  type: string
                  enum: [eu_ai_act, nist, imda]
      additionalPrinterColumns:
        - name: Frameworks
          type: string
          jsonPath: .spec.complianceFramework
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentregistrations.aegis.ai
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  group: aegis.ai
  names:
    kind: AgentRegistration
    plural: agentregistrations
    singular: agentregistration
    shortNames:
      - areg
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                agentId:
                  type: string
                framework:
                  type: string
                  enum: [langgraph, crewai, autogen, openai, mcp, google_adk, other]
                identityType:
                  type: string
                  enum: [spiffe, oauth, mtls]
                allowedTools:
                  type: array
                  items:
                    type: string
                allowedModels:
                  type: array
                  items:
                    type: string
                maxRecursionDepth:
                  type: integer
                  minimum: 1
                  maximum: 100
                budgetLimitUsd:
                  type: number
                  minimum: 0
                humanApprovalRequired:
                  type: boolean
                autonomyLevel:
                  type: integer
                  minimum: 1
                  maximum: 5
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Active, Paused, Terminated, Compromised]
                lastSeen:
                  type: string
                  format: date-time
                policyViolations:
                  type: integer
