apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-gateway
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - name: AEGIS_GATEWAY_PORT
              value: "8000"
            - name: AEGIS_GATEWAY_GRPC_PORT
              value: "8001"
            - name: AEGIS_REDIS_ADDR
              value: {{ .Values.controlPlane.redis.addr | quote }}
            - name: AEGIS_CONTROL_PLANE_ADDR
              value: "{{ include "aegis.fullname" . }}-control-plane:8500"
            - name: AEGIS_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.endpoint | quote }}
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-gateway
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.gateway.service.grpcPort }}
      targetPort: grpc
      name: grpc
  selector:
    app.kubernetes.io/component: gateway
