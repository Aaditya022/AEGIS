apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-audit-log
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-log
spec:
  replicas: {{ .Values.auditLog.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: audit-log
  template:
    metadata:
      labels:
        app.kubernetes.io/component: audit-log
    spec:
      containers:
        - name: audit-log
          image: "{{ .Values.auditLog.image.repository }}:{{ .Values.auditLog.image.tag }}"
          imagePullPolicy: {{ .Values.auditLog.image.pullPolicy }}
          env:
            - name: AEGIS_AUDIT_LISTEN
              value: "0.0.0.0:9100"
            - name: AEGIS_KAFKA_BROKERS
              value: {{ .Values.controlPlane.kafka.brokers | quote }}
          ports:
            - containerPort: 9100
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/audit/verify
              port: http
          resources:
            {{- toYaml .Values.auditLog.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-audit-log
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-log
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.auditLog.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/component: audit-log
