[advisories]
vulnerability = "deny"
unmaintained = "all"
notice = "all"
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2024-0001",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
deny = [
  "GPL-3.0",
  "GPL-2.0",
  "AGPL-3.0",
]
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
allow-git = []
unknown-registry = "deny"
unknown-git = "deny"
